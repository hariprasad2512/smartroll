zerops:
  - setup: backend
    build:
      base: ubuntu/python@3.12
      buildCommands:
        # Install dependencies into vendor/ inside the build container
        # (Zerops builds on Linux so binaries will be Linux-compatible)
        - pip install --target=./vendor -r requirements.txt
      deployFiles:
        - .

    run:
      base: ubuntu/python@3.12
      ports:
        - port: 8000
          httpSupport: true
      envVariables:
        PYTHONPATH: /var/www/vendor
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
        GOOGLE_CLIENT_ID: ${google_client_id}
        FACULTY_EMAILS: ${faculty_emails}
      start: /var/www/vendor/bin/uvicorn main:app --host 0.0.0.0 --port 8000
